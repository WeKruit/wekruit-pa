# Phase 24 — Voice eval CI gate.
# Apply `run-voice-eval` label to PRs that touch voice code.
# Daily cron at 04:30 UTC tracks drift.
# Fails when ClaireVoice pass-rate < 75% (CLAIRE_VOICE_THRESHOLD=0.75).
#
# NOTE: This workflow will fail fast in initial runs because ANTHROPIC_API_KEY
# may not yet be provisioned in GitHub Actions secrets. That provisioning is
# a Wave 2 checkpoint (plan 07). The YAML must exist and be valid; the first
# green run waits on secret provisioning.
#
# Cost guard: 50 cases x claude-opus-4-5 per run = small but real cost.
# NEVER trigger on every PR. The labeled trigger is intentionally opt-in.

name: voice-eval

on:
  pull_request:
    types: [labeled]
  schedule:
    # 04:30 UTC daily — tracks drift, separate from eval.yml nightly (03:17 UTC)
    - cron: "30 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  voice-eval:
    # For PR events: only run when the `run-voice-eval` label is applied.
    # For schedule and workflow_dispatch: always run.
    if: |
      github.event_name != 'pull_request' ||
      github.event.label.name == 'run-voice-eval'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }}
      CLAIRE_VOICE_THRESHOLD: "0.75"
      PA_RUN_EVAL: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install -r apps/eval/voice/requirements.txt

      - name: Run voice eval
        run: deepeval test run apps/eval/voice/test_voice_baseline.py -n 4

      - name: Upload eval artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: voice-eval-${{ github.run_id }}
          path: eval-results/
          retention-days: 30
          if-no-files-found: warn
