# Phase 14.4 — companion eval harness CI integration.
#
# This workflow does NOT run on every push or every PR. Per Phase 14 plan
# §"CI integration story", judge calls + scenario runtime make per-PR
# infeasible. We trigger explicitly:
#   - PR `labeled` with `run-eval` (manual opt-in by reviewer)
#   - Nightly `schedule` cron on main
#   - `workflow_dispatch` for ad-hoc runs from the Actions UI
#
# Cost ceiling enforced via PA_EVAL_MAX_RUN_USD=5 (default in runner) +
# the runner's per-call pre-flight check; see tests/scenarios/judge.mjs
# and tests/scenarios/runner.mjs `makeCostLedger`.
#
# This workflow is NOT a required check on PR merge. False positives in
# the judge would otherwise block merges.
name: eval

on:
  pull_request:
    types: [labeled]
  schedule:
    # 03:17 UTC nightly — off-peak vs. PR runs.
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  eval:
    # Skip the labeled trigger for any label other than `run-eval`.
    if: |
      github.event_name != 'pull_request' ||
      github.event.label.name == 'run-eval'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PA_RUN_EVAL: "1"
      PA_RUN_SCENARIOS: "1"
      PA_EVAL_MAX_RUN_USD: "5"
      # Secrets resolved at the GitHub Actions level — never embedded
      # in this file or in the judge.jsonl artifact.
      PA_OPENAI_AGENT_API_KEY: ${{ secrets.PA_OPENAI_AGENT_API_KEY }}
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
    steps:
      - uses: actions/checkout@v4

      # pnpm, not npm — matches test.yml / qa-v1.5.yml / ranking-eval.yml.
      # `npm ci` is unusable here: the root `//zod-split` note documents that
      # zod@4 (root) vs openai@4's peerOptional zod@^3 is an expected
      # cross-workspace ERESOLVE that npm only installs past with --force.
      # Nightly runs 2026-07-20..25 all died on that install step.
      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # No workspace build step: tests/scenarios/runner.mjs imports only node
      # builtins + root deps (yaml, firebase-admin, openai) + sibling .mjs —
      # nothing from any @pa/*/dist.
      - name: Dry-run plan (sanity check)
        run: pnpm run eval -- --dry-run

      - name: Run eval
        run: pnpm run eval

      - name: Upload eval artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-runs-${{ github.run_id }}
          path: eval-runs/
          if-no-files-found: warn
          retention-days: 30
