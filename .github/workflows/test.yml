# Unit test + typecheck CI gate.
#
# Runs on every push to main + every PR. Blocks merge if typecheck red or
# any package's test suite red. Catches the class of failure that hit on
# 2026-04-28 (commit 1ae0de4 changed test fixtures but not verifier code,
# 8 webhook tests went red on main; nobody noticed for 22h until Phase 32
# deploy rolled the broken main into prod).
#
# Cost: ~3 min per run on GitHub-hosted Ubuntu. Free for public repos and
# included in the team plan for private.
#
# 2026-07-25 trigger trim: PR-only. A PR run already tests the merge of head
# into main, so the push-on-main run re-tested an identical tree ~3 min later
# and doubled this workflow's runs for zero extra signal. Same checks locally:
# `pnpm -r build && pnpm -r typecheck && pnpm -r test`.

name: test

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck-and-test:
    name: typecheck + unit tests
    runs-on: ubuntu-latest
    # The suite outgrew 15m and started cancelling mid-test-run — on main as well as on branches,
    # so a green tick was becoming luck rather than evidence. Measured 2026-07-27 on a real run:
    # setup 26s + install 7s + build 3m03 + typecheck 1m30 = 4m40 before a single test executes,
    # and the tests themselves were still going at 10m13 when the ceiling killed them.
    #
    # 30 keeps the hang-protection this exists for while fitting the work. The number to watch is
    # TEST WALL-CLOCK, now >10m across ~3800 tests: if it passes ~20m, parallelise the workspaces
    # rather than raising this again.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # iter32 deploy-fix 2026-05-04 — typecheck of apps/eval/external-benchmarks
      # imports from pa-orchestrator/dist/* (build artifacts), so we must run
      # a workspace build before typecheck or those packages fail with
      # TS2307 "Cannot find module .../dist/...". This was a pre-existing CI
      # red on this branch; cheap fix.
      - name: Build (workspace, prerequisite for typecheck of dist-import sites)
        run: pnpm -r build

      - name: Typecheck (all 15 packages)
        run: pnpm -r typecheck

      - name: Unit tests (all packages)
        run: pnpm -r test
        env:
          # Tests must not hit external services — pin to dummy values to
          # surface accidental network calls as immediate failures.
          NODE_ENV: test
          # Required by feature-flag tests that read env override.
          PA_DASHBOARD_ENV: test
