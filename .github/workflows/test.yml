# Unit test + typecheck CI gate.
#
# Runs on every push to main + every PR. Blocks merge if typecheck red or
# any package's test suite red. Catches the class of failure that hit on
# 2026-04-28 (commit 1ae0de4 changed test fixtures but not verifier code,
# 8 webhook tests went red on main; nobody noticed for 22h until Phase 32
# deploy rolled the broken main into prod).
#
# Cost: ~16 min per run on GitHub-hosted Ubuntu. Free for public repos and
# included in the team plan for private.
#
# 2026-07-25 — timeout raised 15 -> 30 min. The original 15 was sized for the
# "~3 min" suite of 2026-04; it is now 22 packages and the job legitimately
# needs ~16 min, so it was being killed mid-run at the cap:
#   install 0:40 · build 2:45 · typecheck 1:05 · unit tests 11:00+
# The unit-test step is the bulk, and the last package to run (apps/functions,
# 3676 tests) was still going when the axe fell. This was invisible until
# 2026-07-25 because the build step had been failing first for days.
#
# ~1 min of the unit-test step is duplicate work: apps/functions `pretest`
# re-builds 16 workspace packages that step "Build (workspace...)" already
# built. Worth trimming if this ever approaches the new cap; not urgent.

name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck-and-test:
    name: typecheck + unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # iter32 deploy-fix 2026-05-04 — typecheck of apps/eval/external-benchmarks
      # imports from pa-orchestrator/dist/* (build artifacts), so we must run
      # a workspace build before typecheck or those packages fail with
      # TS2307 "Cannot find module .../dist/...". This was a pre-existing CI
      # red on this branch; cheap fix.
      - name: Build (workspace, prerequisite for typecheck of dist-import sites)
        run: pnpm -r build

      - name: Typecheck (all 15 packages)
        run: pnpm -r typecheck

      - name: Unit tests (all packages)
        run: pnpm -r test
        env:
          # Tests must not hit external services — pin to dummy values to
          # surface accidental network calls as immediate failures.
          NODE_ENV: test
          # Required by feature-flag tests that read env override.
          PA_DASHBOARD_ENV: test
