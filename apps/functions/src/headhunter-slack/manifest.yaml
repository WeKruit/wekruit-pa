# WeKruit Headhunter — Slack app manifest (HTTP events mode)
#
# TWO-PHASE create (because Slack verifies request_url at import time, and the
# paHeadhunterSlack receiver is deployed in M4 — so we create WITHOUT URLs first,
# then add the event/interactivity URLs once the receiver is live).
#
# ── Phase 1: create the app (paste the JSON below at api.slack.com/apps →
#    Create New App → From a manifest → JSON tab). No request_url ⇒ no
#    verification ⇒ clean import.
# ── Phase 2 (after `paHeadhunterSlack` is deployed): add the `event_subscriptions`
#    and `interactivity` blocks at the bottom of this file via the app's
#    Event Subscriptions / Interactivity pages (URL verifies then).
#
# Tokens to grab after install (HTTP mode needs only TWO):
#   • SLACK_BOT_TOKEN      — OAuth & Permissions → Bot User OAuth Token (xoxb-…)
#   • SLACK_SIGNING_SECRET — Basic Information → App Credentials → Signing Secret
# (No xapp- app-level token — that is Socket Mode only.)

