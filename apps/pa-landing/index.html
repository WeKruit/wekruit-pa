<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WeKruit — interview, don't apply.</title>
    <meta
      name="description"
      content="Upload your résumé once. Claire, your WeKruit recruiter on iMessage, gets to know you. When a role matches, she pitches you to the hiring manager and books the first interview — no application, no recruiter screen. Your live pipeline (Up next · In motion · New roles) lives at /me."
    />
    <meta name="theme-color" content="#F5EDE3" />
    <meta name="color-scheme" content="light" />

    <!-- Open Graph / social -->
    <meta property="og:title" content="WeKruit — interview, don't apply." />
    <meta
      property="og:description"
      content="Skip the application. Claire screens you over iMessage, then books you with the hiring manager. Your pipeline at candidate.wekruit.com/me."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://wekruit.com/" />
    <meta property="og:site_name" content="WeKruit" />
    <meta property="og:image" content="https://wekruit.com/brand/wekruit-social-card.jpg" />
    <meta property="og:image:secure_url" content="https://wekruit.com/brand/wekruit-social-card.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="WeKruit logo with the tagline: interview, don't apply." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:domain" content="wekruit.com" />
    <meta name="twitter:url" content="https://wekruit.com/" />
    <meta name="twitter:title" content="WeKruit — interview, don't apply." />
    <meta
      name="twitter:description"
      content="Skip the application. Claire screens you over iMessage, then books you with the hiring manager."

    <link rel="icon" type="image/png" sizes="32x32" href="/brand/favicon-32x32.png" />

    <link rel="apple-touch-icon" sizes="180x180" href="/brand/apple-touch-icon.png" />

    <style>
      /* Cream background fallback before React + CandidateShell mount, so the
         hero halo never flashes white. Mirrors the design prototype's index.html. */
      html { background: #F5EDE3; scroll-behavior: smooth; }
      body { margin: 0; background: #F5EDE3; color: #2D1A0A;
        font-family: 'Hanken Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        -webkit-font-smoothing: antialiased; }
    </style>
