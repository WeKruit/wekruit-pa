# LiveKit Cloud managed agent hosting config (v2.1 Lock L12).
#
# This file is read by `lk agent deploy` to build + register the WeKruit
# voice prescreen worker. NO Dockerfile, NO k8s manifest, NO
# docker-compose.yml — LiveKit Cloud builds the container from `runtime` +
# `entry` below.

[project]
# LK Cloud project subdomain (matches wss://wekruit-7v74qbl3.livekit.cloud).
subdomain = "wekruit-7v74qbl3"

[agent]
name = "voice-prescreen"
# Node 20 runtime (LiveKit Cloud-supported).
runtime = "node20"
# Entrypoint produced by `pnpm --filter voice-agent build`.
entry = "dist/cli.js"
# Single-instance concurrency default. Revisit after S6 smoke + capacity
# planning (S5/S6 own this).
max_concurrent_jobs = 1

[agent.env]
# Set at deploy time via `lk agent env set …`. The worker reads these.
LIVEKIT_URL = ""
LIVEKIT_API_KEY = ""
LIVEKIT_API_SECRET = ""
DEEPGRAM_API_KEY = ""
# W2: voice worker uses in-process WekruitLLM → runAgentTurnStream → OpenAI.
# `OPENAI_API_KEY` is required for the agent-runtime OpenAI provider.
OPENAI_API_KEY = ""
WEKRUIT_VOICE_RECORDINGS_BUCKET = "wekruit-voice-recordings"
PA_AGENT_RUNTIME_STREAM_ENABLED = "true"
# v2.2 — voice → orchestrator brain bridge (paVoiceCallContext +
# paVoicePrescreenTurn callable CFs).
WEKRUIT_VOICE_CONTEXT_URL = "https://us-central1-wekruit-5f89b.cloudfunctions.net/paVoiceCallContext"
WEKRUIT_VOICE_PRESCREEN_TURN_URL = "https://us-central1-wekruit-5f89b.cloudfunctions.net/paVoicePrescreenTurn"
PA_VOICE_CF_SECRET = ""
