# LiveKit Cloud managed agent hosting binding (post-W4 deploy 2026-05-17).
#
# After `lk agent create` (agent CA_CyhBjJioxJR9) succeeded, LK Cloud
# now owns runtime config (entry / env / replicas / region) server-side.
# This file is the local binding so `lk agent deploy / status / logs /
# restart` knows which agent to target.
#
# Deploy workflow (W4):
#   1. bash apps/voice-agent/scripts/build-lk-deploy.sh
#      → writes /tmp/lk-deploy-voice-agent/  (slim Dockerfile + dist/ +
#                                              workspace-resolved node_modules)
#   2. cd /tmp/lk-deploy-voice-agent
#   3. lk agent deploy --project wekruit  (re-build + roll the agent)
#      or  lk agent update-secrets --project wekruit --secrets-file <file>
#          (rotate env without rebuild)
#
# Required server-side secrets (set via `lk agent update-secrets
# --secrets-file <file>`):
#   LIVEKIT_URL / LIVEKIT_API_KEY / LIVEKIT_API_SECRET
#   DEEPGRAM_API_KEY
#   OPENAI_API_KEY                — consumed by @pa/agent-runtime via WekruitLLM
#   PA_VOICE_CF_SECRET             — auth for paVoiceCallContext + paVoicePrescreenTurn CFs
#   WEKRUIT_VOICE_CONTEXT_URL      — https://us-central1-wekruit-5f89b.cloudfunctions.net/paVoiceCallContext
#   WEKRUIT_VOICE_PRESCREEN_TURN_URL — https://us-central1-wekruit-5f89b.cloudfunctions.net/paVoicePrescreenTurn
#   WEKRUIT_VOICE_ONBOARDING_TURN_URL — https://us-central1-wekruit-5f89b.cloudfunctions.net/paVoiceOnboardingTurn
#   WEKRUIT_VOICE_RECORDINGS_BUCKET = "wekruit-voice-recordings"
#   PA_AGENT_RUNTIME_STREAM_ENABLED = "true"
#
# Region: us-east (set at create-time).

[project]
  subdomain = "wekruit-7v74qbl3"

[agent]
  id = "CA_CyhBjJioxJR9"
