[project]
name = "wekruit-shared-tags"
version = "0.1.0"
description = "Python port of @wekruit/shared-tags — canonical-tag idempotent write contract for PA + scraping repos. Byte-parity with TS via sha256 idempotency key."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "UNLICENSED" }
authors = [{ name = "WeKruit", email = "developers@wekruit.com" }]
keywords = ["wekruit", "shared-tags", "firestore", "tags", "canonical"]

dependencies = [
  "pydantic>=2.5,<3",
]

[project.optional-dependencies]
firestore = [
  "google-cloud-firestore>=2.14",
]
test = [
  "pytest>=7",
  "pytest-asyncio>=0.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["wekruit_shared_tags"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
